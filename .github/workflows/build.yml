name: CI

on:
    workflow_dispatch:
    push:
    pull_request:
    schedule:
        -   cron: '30 5 * * *'

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4

            -   name: Set up Java 21
                uses: actions/setup-java@v4
                with:
                    distribution: temurin
                    java-version: 21

            -   name: Validate Gradle wrapper
                uses: gradle/actions/wrapper-validation@v3

            -   name: Set up Gradle
                uses: gradle/actions/setup-gradle@v3
                with:
                    cache-read-only: ${{ github.event_name == 'pull_request' }}

            -   name: Install NDK
                run: |
                    SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
                    NDK_VERSION="$(yq .versions.ndk gradle/libs.versions.toml)"
                    echo "Installing NDK ${NDK_VERSION}"
                    echo "y" | "$SDKMANAGER" "ndk;$NDK_VERSION" --sdk_root="${ANDROID_SDK_ROOT}"

            -   name: Run debug build
                run: bash .github/run-step.sh assembleDebug

            -   name: Upload artifact to GitHub
                uses: actions/upload-artifact@v4
                with:
                    name: Steer-debug.apk
                    path: build/outputs/apk/debug/*.apk

            -   name: Run release build
                run: bash .github/run-step.sh assembleRelease

            -   name: Unit tests
                if: always()
                run: bash .github/run-step.sh test

            -   name: Run PMD
                if: always()
                run: bash .github/run-step.sh pmd

            -   name: Run checkstyle
                if: always()
                run: bash .github/run-step.sh checkstyle

            -   name: Android Lint
                if: always()
                run: bash .github/run-step.sh lint
